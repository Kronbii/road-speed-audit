name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests experiments
          ruff format --check src tests experiments
      - name: Tests (includes a synthetic video end-to-end test)
        run: pytest -q
      - name: Quick synthetic end-to-end through the CLI
        run: |
          roadspeed synth --out work/sim --preset small --seed 3 --duration 20
          roadspeed run work/sim/video.mp4 --config work/sim/site.json --out work/run --quiet --review-sheets
          roadspeed report work/run --n-boot 300
          python - <<'PY'
          import json
          recs = json.load(open("work/run/records.json"))["records"]
          valid = [r for r in recs if r["status"] == "valid"]
          print(f"{len(recs)} records, {len(valid)} valid")
          assert len(valid) >= 3
          PY
      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-py${{ matrix.python-version }}
          path: |
            work/run/report.html
            work/run/records.csv
          if-no-files-found: ignore
